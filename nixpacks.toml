# Railway Nixpacks Configuration
# This configures the Railway build environment to support Puppeteer
# Based on: https://github.com/ryannono/Puppeteer-Railway-Buildpack

[phases.setup]
# Install Chrome/Chromium dependencies via apt (required for Puppeteer)
# Updated for Ubuntu 24.04 (Noble) - libasound2 renamed to libasound2t64
aptPkgs = [
  'fonts-liberation',
  'libasound2t64',
  'libatk-bridge2.0-0',
  'libatk1.0-0',
  'libgbm1',
  'libgtk-3-0',
  'libnspr4',
  'libnss3',
  'libx11-xcb1',
  'libxcomposite1',
  'libxcursor1',
  'libxdamage1',
  'libxfixes3',
  'libxi6',
  'libxrandr2',
  'libxss1',
  'libxtst6',
  'xdg-utils',
  # Additional fonts for PDF rendering
  'fonts-dejavu-core',
  'fonts-noto-core'
]

[phases.install]
cmds = ["npm ci"]

[start]
cmd = "npm start"

[variables]
# Let Puppeteer download and use its own bundled Chromium
# Note: Puppeteer 24.x uses PUPPETEER_SKIP_DOWNLOAD (not PUPPETEER_SKIP_CHROMIUM_DOWNLOAD)
PUPPETEER_SKIP_DOWNLOAD = "false"
# Production environment
NODE_ENV = "production"
